spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nocontact_db}
    username: ${DB_USER:nocontact_user}
    password: ${DB_PASSWORD:nocontact_secret_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:SuperSecretRickPrimeDimensionalKeyOmegaDevice999999}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:86400000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

server:
  port: ${PORT:8080}