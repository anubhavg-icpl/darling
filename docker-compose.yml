version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: nocontact-postgres
    restart: always
    environment:
      POSTGRES_DB: nocontact_db
      POSTGRES_USER: nocontact_user
      POSTGRES_PASSWORD: nocontact_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocontact_user -d nocontact_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nocontact-backend
    restart: on-failure
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/nocontact_db
      DB_USER: nocontact_user
      DB_PASSWORD: nocontact_secret_password
      JWT_SECRET: SuperSecretRickPrimeDimensionC137Key999999
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
